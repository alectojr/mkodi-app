{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKodi - Forgot Password</title>
    <link rel="stylesheet" href="{% static 'css/mkodi-style.css' %}">
</head>
<body class="page-shell">
    <div class="page-content">
        <div class="form-shell">
            <div class="form-header">
                <h1>MKodi</h1>
                <p>Request a temporary password using your TIN</p>
            </div>
            <div class="form-body">
                {% if messages %}
                <div style="margin-bottom: 24px; padding: 18px; background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; border-radius: 18px;">
                    {% for message in messages %}
                    <p>{{ message }}</p>
                    {% endfor %}
                </div>
                {% endif %}

                <form id="forgotPasswordForm" method="POST" novalidate>
                    {% csrf_token %}
                    <div>
                        <label for="tin_number">TIN Number *</label>
                        <input type="text" id="tin_number" name="tin_number" placeholder="Enter your registered TIN" required>
                    </div>
                    <button type="submit" class="btn-primary">Generate Temporary Password</button>
                </form>

                <div style="margin-top: 24px; text-align: center; color: #475569; font-size: 0.95rem;">
                    Remembered your password? <a href="/" style="color: #2563eb; text-decoration: none;">Login here</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
            const tin = document.getElementById('tin_number').value.trim();
            if (!tin) {
                e.preventDefault();
                alert("Please enter your TIN Number");
            }
        });
    </script>
</body>
</html>
