{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKodi - Change Password</title>
    <link rel="stylesheet" href="{% static 'css/mkodi-style.css' %}">
</head>
<body class="page-shell portal-shell">
    <main class="page-content">
        {% include 'partials/portal_nav.html' %}
        <section class="page-heading"><p class="eyebrow">Account security</p><h1>Change password</h1><p>Choose a new password for your MKodi account.</p></section>
        {% if messages %}<div class="message-stack">{% for message in messages %}<div class="portal-message">{{ message }}</div>{% endfor %}</div>{% endif %}
        <section class="security-form card">
            <form method="post" class="password-form">
                {% csrf_token %}
                <label for="current_password">Current password</label><input id="current_password" name="current_password" type="password" required>
                <label for="new_password">New password</label><input id="new_password" name="new_password" type="password" minlength="8" required>
                <label for="confirm_password">Confirm new password</label><input id="confirm_password" name="confirm_password" type="password" minlength="8" required>
                <button class="btn-primary" type="submit">Update password</button>
            </form>
        </section>
    </main>
</body>
</html>
