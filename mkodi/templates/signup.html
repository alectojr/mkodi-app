{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKodi - Create Account</title>
    <link rel="stylesheet" href="{% static 'css/mkodi-style.css' %}">
</head>
<body class="page-shell">
    <div class="page-content">
        <div class="form-shell">
            <div class="form-header">
                <h1>MKodi</h1>
                <p>Join the future of integrated revenue intelligence in Tanzania</p>
            </div>
            <div class="form-body">
                {% if messages %}
                <div style="margin-bottom: 24px; padding: 18px; background: #fff1f2; border: 1px solid #fecdd3; color: #b91c1c; border-radius: 18px;">
                    {% for message in messages %}
                    <p>{{ message }}</p>
                    {% endfor %}
                </div>
                {% endif %}
                <form id="signupForm" method="POST" class="space-y-6">
                    {% csrf_token %}
                    <div>
                        <label for="full_name">Full Name *</label>
                        <input type="text" id="full_name" name="full_name" placeholder="Enter your full name" required>
                    </div>
                    <div>
                        <label for="tin_number">TIN Number *</label>
                        <input type="text" id="tin_number" name="tin_number" maxlength="20" placeholder="Enter your TIN" required>
                    </div>
                    <div>
                        <label for="phone_number">Phone Number *</label>
                        <input type="tel" id="phone_number" name="phone_number" placeholder="255712345678" required>
                    </div>
                    <div>
                        <label for="email">Email Address (Optional)</label>
                        <input type="email" id="email" name="email" placeholder="yourname@example.com">
                    </div>
                    <div>
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" placeholder="Create a strong password" required>
                        <p style="font-size: 0.9rem; color: #64748b; margin-top: 8px;">Minimum 8 characters</p>
                    </div>
                    <div>
                        <label for="password_confirm">Confirm Password *</label>
                        <input type="password" id="password_confirm" name="password_confirm" placeholder="Confirm your password" required>
                    </div>
                    <button type="submit" class="btn-primary">Create My MKodi Account</button>
                </form>
                <div style="margin-top: 24px; text-align: center; color: #475569; font-size: 0.95rem;">
                    Already have an account? <a href="/" style="color: #2563eb; text-decoration: none;">Login here</a>
                </div>
            </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            console.log('Form submitted');

            const fullName = document.getElementById('full_name').value.trim();
            const tinNumber = document.getElementById('tin_number').value.trim();
            const phoneNumber = document.getElementById('phone_number').value.trim();
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('password_confirm').value;

            console.log('Form data:', {fullName, tinNumber, phoneNumber, password, passwordConfirm});

            if (!fullName) {
                e.preventDefault();
                alert("Please enter your full name");
                return;
            }

            if (!tinNumber) {
                e.preventDefault();
                alert("Please enter your TIN number");
                return;
            }

            if (!phoneNumber) {
                e.preventDefault();
                alert("Please enter your phone number");
                return;
            }

            if (!password) {
                e.preventDefault();
                alert("Please enter a password");
                return;
            }

            if (password.length < 8) {
                e.preventDefault();
                alert("Password must be at least 8 characters long");
                return;
            }

            if (password !== passwordConfirm) {
                e.preventDefault();
                alert("Passwords do not match");
                return;
            }

            console.log('All validations passed, submitting...');
        });
    </script>
</body>
</html>
