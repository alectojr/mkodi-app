{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKodi - Login</title>
    <link rel="stylesheet" href="{% static 'css/mkodi-style.css' %}">
</head>
<body class="page-shell">
    <div class="page-content">
        <div class="form-shell">
            <div class="form-header">
                <h1>MKodi</h1>
                <p>Secure login to Tanzania’s mobile-first tax portal</p>
            </div>
            <div class="form-body">
                {% if messages %}
                <div style="margin-bottom: 24px; padding: 18px; background: #fff1f2; border: 1px solid #fecdd3; color: #b91c1c; border-radius: 18px;">
                    {% for message in messages %}
                    <p>{{ message }}</p>
                    {% endfor %}
                </div>
                {% endif %}
                <form id="loginForm" method="POST" novalidate>
                    {% csrf_token %}
                    <div>
                        <label for="tin_number">TIN Number *</label>
                        <input type="text" id="tin_number" name="tin_number" placeholder="Enter your TIN" required>
                    </div>
                    <div>
                        <label for="password">Password *</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn-primary">Login to MKodi</button>
                </form>
                <div style="margin-top: 20px; display: flex; justify-content: space-between; font-size: 0.95rem; color: #475569;">
                    <a href="#" style="color: #2563eb; text-decoration: none;">Forgot Password?</a>
                    <a href="/signup/" style="color: #2563eb; text-decoration: none;">Create Account</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const tin = document.getElementById('tin_number').value.trim();
            if (!tin) {
                e.preventDefault();
                alert("Please enter your TIN Number");
            }
        });
    </script>
</body>
</html>
