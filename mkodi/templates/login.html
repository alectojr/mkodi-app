<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKodi - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
        <!-- Header -->
        <div class="bg-green-700 text-white p-10 text-center">
            <h1 class="text-5xl font-bold">MKodi</h1>
            <p class="mt-2 text-green-100">Secure Login to Your Tax Portal</p>
        </div>

        <div class="p-8">
            <form id="loginForm" method="POST" class="space-y-6">
                {% csrf_token %}

                <div>
                    <label for="tin_number" class="block text-sm font-medium text-gray-700 mb-2">
                        TIN Number <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="tin_number" name="tin_number" placeholder="Enter your TIN" required
                           class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-600 text-lg">
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Password <span class="text-red-500">*</span>
                    </label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required
                           class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-600 text-lg">
                </div>

                <button type="submit"
                        class="w-full bg-green-700 hover:bg-green-800 text-white py-4 rounded-2xl font-semibold text-lg transition-all">
                    Login to MKodi
                </button>
            </form>

            <div class="flex justify-between text-sm mt-6">
                <a href="#" class="text-green-600 hover:underline">Forgot Password?</a>
                <a href="/signup/" class="text-green-700 font-semibold hover:underline">Create Account</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const tin = document.getElementById('tin_number').value.trim();

            if (!tin) {
                e.preventDefault();
                alert("Please enter your TIN Number");
            }
        });
    </script>
</body>
</html>
